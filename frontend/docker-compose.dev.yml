version: "3.8"

services:
  template-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: template-app-dev:v1
    container_name: template-app-dev
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    volumes:
      # Mount entire project for hot reload (excluding node_modules and .next)
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - template-network

networks:
  template-network:
    driver: bridge

version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: electroshop-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electroshop-dev

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: electroshop-backend-dev:latest
    container_name: electroshop-backend-dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Mount the entire backend directory for hot reload
      - .:/app
      # Exclude node_modules and other build artifacts if any
      - /app/.venv
      - /app/venv
      - /app/env
    ports:
      - "8006:8000"
    environment:
      - DEBUG=True
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - electroshop-dev

networks:
  electroshop-dev:
    driver: bridge

volumes:
  postgres_data_dev:

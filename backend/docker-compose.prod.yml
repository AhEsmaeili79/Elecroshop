version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: electroshop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: electroshop-backend:v2
    container_name: electroshop-backend
    command: sh -c "sleep 10 && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8005:8000"
    environment:
      DB_NAME: ${POSTGRES_DB:-electroshop}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cleanup:
    image: docker:cli
    container_name: electroshop-cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - "sleep 20 && docker image prune -f && echo Cleanup completed: Dangling images removed"
    depends_on:
      - web
    restart: "no"

volumes:
  postgres_data:

version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: electroshop-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electroshop-prod
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    container_name: electroshop-redis-prod
    volumes:
      - redis_data:/data
    networks:
      - electroshop-prod
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: electroshop-backend-prod:latest
    container_name: electroshop-backend-prod
    command: ["/app/entrypoint.sh"]
    volumes:
      - static_files:/app/staticfiles
    environment:
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-95.216.121.250}
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - electroshop-prod
    restart: "no"

  granian:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: electroshop-backend-prod:latest
    container_name: electroshop-granian-prod
    command: granian --interface asgi config.asgi:application --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop
    environment:
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-95.216.121.250}
    env_file:
      - .env.prod
    depends_on:
      - web
      - db
      - redis
    networks:
      - electroshop-prod
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: electroshop-backend-prod:latest
    container_name: electroshop-celery-prod
    command: celery -A config worker --loglevel=info
    environment:
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-95.216.121.250}
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    networks:
      - electroshop-prod
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: electroshop-nginx-prod
    ports:
      - "8090:80"
    volumes:
      - ./config/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/usr/share/nginx/static
      - nginx_logs:/var/log/nginx
    depends_on:
      - granian
    networks:
      - electroshop-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cleanup:
    image: docker:cli
    container_name: electroshop-cleanup-prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - "sleep 30 && docker image prune -f && echo Cleanup completed: Dangling images removed"
    depends_on:
      - nginx
    networks:
      - electroshop-prod
    restart: "no"

networks:
  electroshop-prod:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  static_files:

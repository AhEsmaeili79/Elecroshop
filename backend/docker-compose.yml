version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: electroshop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: electroshop_web
    command: >
      sh -c "
      echo 'Waiting for PostgreSQL to be ready...' &&
      python -c \"
      import sys, time, psycopg2
      from os import environ
      max_attempts = 30
      for attempt in range(max_attempts):
        try:
          conn = psycopg2.connect(
            dbname=environ.get('DB_NAME', 'electroshop'),
            user=environ.get('DB_USER', 'postgres'),
            password=environ.get('DB_PASSWORD', 'postgres'),
            host=environ.get('DB_HOST', 'db'),
            port=environ.get('DB_PORT', '5432')
          )
          conn.close()
          print('PostgreSQL is ready!')
          break
        except psycopg2.OperationalError:
          if attempt == max_attempts - 1:
            print('Failed to connect to PostgreSQL after 30 attempts')
            sys.exit(1)
          print(f'Waiting for PostgreSQL... (attempt {attempt + 1}/{max_attempts})')
          time.sleep(1)
      \" &&
      echo 'Running migrations...' &&
      python manage.py migrate --noinput &&
      echo 'Collecting static files...' &&
      python manage.py collectstatic --noinput || true &&
      echo 'Starting server...' &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: electroshop-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroshop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electroshop-dev

  redis:
    image: redis:8.2-alpine
    container_name: electroshop-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - electroshop-dev
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: electroshop-backend-dev:latest
    container_name: electroshop-backend-dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Mount the entire backend directory for hot reload
      - .:/app
    ports:
      - "8006:8000"
    environment:
      - DEBUG=True
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - electroshop-dev

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: electroshop-backend-dev:latest
    container_name: electroshop-celery-dev
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_NAME=${POSTGRES_DB:-electroshop}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - electroshop-dev

networks:
  electroshop-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
